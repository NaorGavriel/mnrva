services:
  # PostgreSQL database service
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: 
      - ./data/postgres:/var/lib/postgresql/data # Persist database data outside the container
    ports:
      - "127.0.0.1:5432:5432"