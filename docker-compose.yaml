services:
  # PostgreSQL database service
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data # Persist database data outside the container
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - ./data/qdrant:/qdrant/storage # Persist vector data outside the container
    ports:
      - "127.0.0.1:6333:6333" # REST API
      - "127.0.0.1:6334:6334" # gRPC API

  api:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

  # One-off: `docker compose run --rm ingest <github_url>` to index a repo.
  ingest:
    build: .
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      QDRANT_URL: http://qdrant:6333
    entrypoint: ["mnrva-ingest"]
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

  # One-off: `docker compose run --rm sync` to refresh the tracked repo. No args - reads github_url/commit_sha from Postgres.
  sync:
    build: .
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      QDRANT_URL: http://qdrant:6333
    entrypoint: ["mnrva-refresh"]
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
