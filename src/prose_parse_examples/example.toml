[project]
name = "mnrva"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NaorGavriel", email = "117026659+NaorGavriel@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-text-splitters>=1.1.2",
    "openai==3.0.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
mnrva = "mnrva:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

# grid is a matrix of coordinate pairs; formatted one row per line so the
# trailing element ends up alone on its own line, no trailing comma.
[tool.some_plugin]
grid = [
    ["a", "b"],
    ["c", "d"]
]

# [[...]] (double brackets) is TOML's array-of-tables syntax: each repeated
# header appends one more entry to the same list, rather than declaring a
# new table.
[[tool.some_plugin.rules]]
name = "no-unused-vars"
severity = "error"

[[tool.some_plugin.rules]]
name = "no-console"
severity = "warn"
